<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <nav style="background: #f4f4f4; padding: 10px; margin-bottom: 20px; border-bottom: 1px solid #ccc;">
        {% if user.is_authenticated %}
            <span>Welcome, <strong>{{ user.username }}</strong>!</span>
			<a href="{% url 'cinema:my_tickets' %}" style="margin-left: 15px; font-weight: bold; color: #0056b3;">My Tickets</a>
            
            <form action="{% url 'accounts:logout' %}" method="post" style="display: inline; margin-left: 10px;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}" style="margin-right: 10px;">Login</a>
            <a href="{% url 'accounts:register' %}">Register</a>
        {% endif %}
    </nav>

    <h1>{{ title }}</h1>

    <ul>
        {% for cinema in cinemas %}
            <li>
                <a href="{% url 'cinema:cinema_detail' cinema.id %}">{{ cinema.name }}</a>
            </li>
        {% empty %}
            <li>No cinemas found.</li>
        {% endfor %}
    </ul>
</body>
</html>
