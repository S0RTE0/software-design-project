<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
    <h1>Register new account</h1>
    
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <div style="margin-bottom: 15px;">
                {{ field.label_tag }} {{ field }}
                {% if field.errors %}
                    <div style="color: red;">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}
        
        <br>
        <button type="submit">Створити акаунт</button>
    </form>
    
    <br>
    <a href="{% url 'cinema:cinema_list' %}">Back to Home</a>
</body>
</html>
